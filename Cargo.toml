[package]
name = "simple_impl_derive"
version = "0.2.1"
edition = "2021"
rust-version = "1.70"
license = "MIT OR Apache-2.0"
description = "Derives that turn a struct into a command-line builder and the argument vector it produces: SimpleBuilder, SimpleShell, SimpleImpl, SimpleShellMode, SimpleSubCommand, CompositeShell, CompositeSubCommand."
authors = ["James Hunt <james@1o.business>"]
repository = "https://github.com/jameshuntt/simple_impl_derive"
readme = "README.md"
keywords = ["derive", "cli", "builder", "shell", "command"]
categories = ["command-line-interface", "development-tools::procedural-macro-helpers"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
prettyplease = "0.2"
liaise = { version = "0.1.6", features = ["std", "syn-error"] }
simple_impl_attr_kit = { version = "0.2.0", path = "../simple_impl_attr_kit" }
simple_impl_core = { version = "0.2.0", path = "../simple_impl_core" }
simple_impl_quote_kit = { version = "0.2.0", path = "../simple_impl_quote_kit" }

[dev-dependencies]
simple_impl = { path = "../simple_impl" }
xccute_contract = { version = "0.1.0", path = "../xccute_contract" }
